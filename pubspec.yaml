name: kisan_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI and Utility Packages
  font_awesome_flutter: ^10.8.0        # Latest as of Nov 2024 [1](https://github.com/fluttercommunity/font_awesome_flutter/releases)
  country_picker: ^2.0.27              # Latest confirmed[3](https://github.com/Daniel-Ioannou/flutter_country_picker)
  phone_number: ^2.1.0                 # No newer version found
  intl_phone_field: ^3.2.0             # No newer version found
  shared_preferences: ^2.2.2           # No newer version found

  # Firebase Packages
  firebase_core: ^3.15.0               # Latest as of July 2025[2](https://firebase.google.com/support/release-notes/flutter)
  cloud_firestore: ^5.6.9              # Latest as of June 2025 [2](https://firebase.google.com/support/release-notes/flutter)
  firebase_auth: ^5.6.0                # Latest as of July 2025 [2](https://firebase.google.com/support/release-notes/flutter)
  firebase_storage: ^12.4.8            # Latest as of July 2025 [2](https://firebase.google.com/support/release-notes/flutter)

  # Device Features
  speech_to_text: ^6.4.0               # No newer version found
  image_picker: ^1.1.2                 # No newer version found
  permission_handler: ^11.3.1          # No newer version found
  flutter_tts: ^4.0.2                  # No newer version found

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/kisan_image.png
    - assets/images/kisan_logo.png
    - assets/images/farmer.jpg
    - assets/images/truck.jpg
    - assets/images/farmer_icon.png
    - assets/images/user.png
